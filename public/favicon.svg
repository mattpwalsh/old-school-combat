<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 100">
  <!-- Shield (heater shape, outline only) -->
  <path d="M 8,8 H 72 V 60 Q 40,94 8,60 Z"
        fill="none" stroke="black" stroke-width="5" stroke-linejoin="round"/>

  <!-- Sword (drawn vertically, rotated 45° so tip is top-right, pommel is bottom-left) -->
  <g transform="rotate(45, 40, 50)">
    <!-- Blade -->
    <polygon points="40,4 37,62 43,62"
             fill="white" stroke="black" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Crossguard -->
    <rect x="27" y="60" width="26" height="7" rx="2"
          fill="white" stroke="black" stroke-width="1.5"/>
    <!-- Grip -->
    <rect x="38" y="67" width="6" height="13" rx="1.5"
          fill="white" stroke="black" stroke-width="1.5"/>
    <!-- Pommel -->
    <circle cx="40" cy="86" r="6"
            fill="white" stroke="black" stroke-width="1.5"/>
  </g>
</svg>
